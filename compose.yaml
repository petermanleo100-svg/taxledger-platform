services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: taxledger
      POSTGRES_USER: taxledger
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes: [taxledger-db:/var/lib/postgresql/data]
    healthcheck: {test: [CMD-SHELL, pg_isready -U taxledger], interval: 5s, timeout: 3s, retries: 20}
    restart: unless-stopped
  api:
    build: .
    environment:
      TAXLEDGER_DATABASE_URL: postgresql+psycopg://taxledger:${POSTGRES_PASSWORD}@postgres:5432/taxledger
      TAXLEDGER_JWT_SECRET: ${TAXLEDGER_JWT_SECRET:?set TAXLEDGER_JWT_SECRET}
      TAXLEDGER_ENV: production
    depends_on: {postgres: {condition: service_healthy}}
    command: ["sh","-c","alembic upgrade head && exec uvicorn taxledger.api:create_app --factory --host 0.0.0.0 --port 8000"]
    ports: ["127.0.0.1:8081:8000"]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped
volumes: {taxledger-db: {}}
