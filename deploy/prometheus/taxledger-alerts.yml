groups:
  - name: taxledger-api
    rules:
      - alert: TaxLedgerHighErrorRate
        expr: sum(rate(taxledger_http_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(taxledger_http_requests_total[5m])), 0.001) > 0.01
        for: 10m
        labels:
          severity: critical
          service: taxledger
          owner: platform-operations
        annotations:
          summary: TaxLedger API 5xx rate exceeds 1%
          runbook_url: https://github.com/petermanleo100-svg/taxledger-platform/blob/main/docs/production-runbook.md
      - alert: TaxLedgerP95LatencyHigh
        expr: histogram_quantile(0.95, sum by (le) (rate(taxledger_http_request_duration_seconds_bucket[10m]))) > 1
        for: 15m
        labels:
          severity: warning
          service: taxledger
          owner: platform-operations
        annotations:
          summary: TaxLedger API p95 latency exceeds one second
          runbook_url: https://github.com/petermanleo100-svg/taxledger-platform/blob/main/docs/production-runbook.md
      - alert: TaxLedgerReadinessUnavailable
        expr: probe_success{job="taxledger-readiness"} == 0
        for: 2m
        labels:
          severity: critical
          service: taxledger
          owner: platform-operations
        annotations:
          summary: TaxLedger readiness probe is unavailable
          runbook_url: https://github.com/petermanleo100-svg/taxledger-platform/blob/main/docs/production-runbook.md
      - alert: TaxLedgerOperationFailed
        expr: taxledger_operation_success == 0
        for: 5m
        labels: {severity: critical, service: taxledger, owner: platform-operations}
        annotations:
          summary: TaxLedger scheduled operation failed
          runbook_url: https://github.com/petermanleo100-svg/taxledger-platform/blob/main/docs/production-runbook.md
      - alert: TaxLedgerTextfileCollectorFailed
        expr: node_textfile_scrape_error{job="taxledger-node-exporter"} == 1
        for: 5m
        labels: {severity: critical, service: taxledger, owner: platform-operations}
        annotations:
          summary: TaxLedger operation metrics collector cannot read one or more textfiles
          runbook_url: https://github.com/petermanleo100-svg/taxledger-platform/blob/main/docs/production-runbook.md
      - alert: TaxLedgerBackupStale
        expr: (time() - taxledger_operation_last_success_timestamp_seconds{operation="backup_create"} > 900) or absent(taxledger_operation_last_success_timestamp_seconds{operation="backup_create"})
        for: 5m
        labels: {severity: critical, service: taxledger, owner: platform-operations}
        annotations:
          summary: TaxLedger has no successful backup inside the 15-minute RPO window
          runbook_url: https://github.com/petermanleo100-svg/taxledger-platform/blob/main/docs/production-runbook.md
