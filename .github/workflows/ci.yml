name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e ".[test]"
      - run: pytest -q
      - run: pip check
      - name: Audit Python dependency vulnerabilities
        run: python scripts/verify_dependency_manifest.py && pip-audit -r requirements-audit.txt
      - name: Validate Prometheus alert rules
        run: |
          docker run --rm --entrypoint /bin/promtool -v "$PWD/deploy/prometheus:/rules:ro" prom/prometheus:v3.11.3 check rules /rules/taxledger-alerts.yml
          docker run --rm --entrypoint /bin/promtool -v "$PWD/deploy/prometheus:/rules:ro" -w /rules prom/prometheus:v3.11.3 test rules taxledger-alerts.test.yml
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine
        env: {POSTGRES_DB: taxledger, POSTGRES_USER: taxledger, POSTGRES_PASSWORD: taxledger}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U taxledger" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e ".[test]"
      - env: {TAXLEDGER_DATABASE_URL: "postgresql+psycopg://taxledger:taxledger@localhost:5432/taxledger"}
        run: alembic upgrade head
      - env: {TEST_POSTGRES_URL: "postgresql+psycopg://taxledger:taxledger@localhost:5432/taxledger"}
        run: pytest -q tests/test_postgres.py
      - name: Validate hardened Compose topology
        env:
          POSTGRES_OWNER_PASSWORD: owner-ci-password
          POSTGRES_APP_PASSWORD: app-ci-password
          TAXLEDGER_JWT_ISSUER: https://id.example
          TAXLEDGER_OIDC_JWKS_URL: https://id.example/jwks
          TAXLEDGER_BACKUP_KEY_BASE64: a2tra2tra2tra2tra2tra2tra2tra2tra2tra2tra2s=
        run: docker compose config --quiet
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: docker build -t taxledger:ci .
      - run: docker run --rm --entrypoint python taxledger:ci --version | grep -Fx 'Python 3.13.15'
      - run: docker inspect taxledger:ci --format '{{.Config.User}}' | grep -Fx taxledger
      - run: docker inspect taxledger:ci --format '{{json .Config.Healthcheck}}' | grep -F health/ready
      - name: Generate SPDX SBOM
        id: sbom_primary
        continue-on-error: true
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          image: taxledger:ci
          format: spdx-json
          output-file: taxledger-sbom.spdx.json
          upload-artifact: false
      - name: Retry SPDX SBOM generation after transient download failure
        if: steps.sbom_primary.outcome == 'failure'
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          image: taxledger:ci
          format: spdx-json
          output-file: taxledger-sbom.spdx.json
          upload-artifact: false
      - name: Require generated SPDX SBOM
        run: test -s taxledger-sbom.spdx.json
      - name: Validate time-bounded vulnerability exceptions
        run: python scripts/verify_vulnerability_exceptions.py
      - name: Block fixable High and Critical vulnerabilities
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2
        with:
          sbom: taxledger-sbom.spdx.json
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: table
          config: .grype.yaml
      - name: Upload SBOM evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: taxledger-sbom-${{ github.sha }}
          path: taxledger-sbom.spdx.json
          retention-days: 30
  compose-smoke:
    runs-on: ubuntu-latest
    env:
      POSTGRES_OWNER_PASSWORD: owner-ci-password
      POSTGRES_APP_PASSWORD: app-ci-password
      TAXLEDGER_JWT_ISSUER: https://id.example
      TAXLEDGER_OIDC_JWKS_URL: https://id.example/jwks
      TAXLEDGER_BACKUP_KEY_BASE64: a2tra2tra2tra2tra2tra2tra2tra2tra2tra2tra2s=
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: docker compose up --build --detach
      - name: Wait for hardened API readiness
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8081/health/ready; then exit 0; fi
            sleep 2
          done
          exit 1
      - if: always()
        run: docker compose ps --all && docker compose logs --no-color
      - if: always()
        run: docker compose down --volumes --remove-orphans
