[project]
name = "taxledger-platform"
version = "1.0.0"
description = "Multi-tenant tax ledger, VAT reconciliation and filing workpaper platform"
requires-python = ">=3.11"
dependencies = ["fastapi==0.141.1", "uvicorn==0.52.1", "sqlalchemy==2.0.51", "pydantic==2.13.4", "PyJWT==2.13.0", "prometheus-client==0.26.0", "psycopg[binary]==3.3.4", "alembic==1.19.1", "cryptography==50.0.0"]

[project.optional-dependencies]
test = ["pytest==9.1.1", "httpx==0.28.1", "pip-audit==2.10.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
taxledger-operations = "taxledger.operations:main"
