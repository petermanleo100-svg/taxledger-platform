[project]
name = "taxledger-platform"
version = "0.1.0"
description = "Multi-tenant tax ledger, VAT reconciliation and filing workpaper platform"
requires-python = ">=3.11"
dependencies = ["fastapi==0.141.1", "uvicorn==0.52.1", "sqlalchemy==2.0.51", "pydantic==2.13.4"]

[project.optional-dependencies]
test = ["pytest==9.1.1", "httpx==0.28.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
